---

variables:
# Suitesparse, as installed with Debian, is thread-parallel using OpenMP.
# OpenMP silently assumes, it can spawn as many threads as there are cores.
# In a worst case scenario, this leads to a number of threads quadratic in
# the core count, if you also do parallel test execution with the maximum
# number of cores. We solve the issue by disallowing OpenMP to allocate more
# than one thread.
  OMP_NUM_THREADS: 1
  DUNECI_PARALLEL: 4


include:
  - project: 'core/ci-config'
    ref: master
    file: 'config/common/master.yml'
  - project: 'core/ci-config'
    ref: master
    file: 'jobs/common/master.yml'

.dune_setup: &dune_setup |-
  . /duneci/bin/duneci-init-job
  duneci-install-module https://gitlab.dune-project.org/core/dune-common.git
  duneci-install-module https://gitlab.dune-project.org/core/dune-geometry.git
  duneci-install-module https://gitlab.dune-project.org/core/dune-localfunctions.git
  duneci-install-module https://gitlab.dune-project.org/staging/dune-uggrid.git
  duneci-install-module https://gitlab.dune-project.org/core/dune-grid.git
  duneci-install-module https://gitlab.dune-project.org/extensions/dune-alugrid.git
  duneci-install-module https://gitlab.dune-project.org/core/dune-istl.git
  duneci-install-module https://gitlab.dune-project.org/staging/dune-typetree.git
  duneci-install-module https://gitlab.dune-project.org/staging/dune-functions.git
  duneci-install-module https://gitlab.dune-project.org/extensions/dune-multidomaingrid.git

before_script:
  - *dune_setup

# ---------------------------------------------------------------------------
# Reuse the standard debian:12 gcc-12-20 / clang-15-20 test jobs to also build
# and install a reusable DUNE prefix (all dependencies plus dune-pdelab), so
# that the downstream tutorials pipeline does not have to rebuild everything
# from scratch. The publish step is opt-in via DUNECI_PUBLISH_INSTALL_PREFIX
# and is attached to the shared `.common` template so it can be enabled per
# job (and is a no-op everywhere else).
#
# DUNECI_INSTALL_STAGE makes the dependencies installed (and their sources
# removed) into /duneci/install in `before_script`; DUNECI_TEST_INSTALL makes
# duneci-standard-test install dune-pdelab itself. PKG_CONFIG_PATH and
# CMAKE_PREFIX_PATH let the subsequent dunecontrol invocations find the
# installed modules, whichever detection mechanism (pkg-config or CMake,
# cf. MR !1509) is in use.
#
# Note: this locally overrides the `.common` template from core/ci-config and
# must be kept in sync with it (before_script/script/stage/tags/artifacts).
# The dotenv report is intentionally *not* added here so that jobs overriding
# `after_script` (e.g. the coverage job) are unaffected.
.common:
  # DUNECI_INSTALL_STAGE=1 installs the dependencies into /duneci/install and
  # removes their sources. That removes dune-common's `dune-ctest`, breaking the
  # `/duneci/bin/duneci-ctest` symlink used by `duneci-standard-test`. Since
  # dune-common installs `dune-ctest` into /duneci/install/bin, repoint the
  # symlink there (no-op for jobs that do not install the dependencies).
  before_script:
    - *dune_setup
    - |
      if [ -x /duneci/install/bin/dune-ctest ]; then
        ln -sf /duneci/install/bin/dune-ctest /duneci/bin/dune-ctest
      fi
  script: duneci-standard-test
  stage: test
  tags: [duneci]
  artifacts:
    expire_in: 2 years
    reports:
      junit: junit/*.xml
  after_script:
    - |
      if [ "${DUNECI_PUBLISH_INSTALL_PREFIX:-}" = "true" ]; then
        echo "Publishing DUNE install prefix"
        # The suffix keeps the two jobs' job-ids apart (INSTALL_JOB_ID_GCC / _CLANG).
        echo "INSTALL_JOB_ID_${DUNECI_PUBLISH_SUFFIX}=${CI_JOB_ID}" > install.env
        mkdir -p "${CI_PROJECT_DIR}/install-prefix"
        cp -a /duneci/install/. "${CI_PROJECT_DIR}/install-prefix/"
      fi

# ---------------------------------------------------------------------------
# Reuse the standard build jobs, but additionally build/install the DUNE
# prefix and publish it as an artifact for the downstream tutorials pipeline.
# Only `variables` and `artifacts` are extended here; `image`, `extends`,
# toolchain and cmake flags are taken over from the included core/ci-config
# jobs via the include-override deep merge.

"debian:12 clang-15-20 (release, require bindings)":
  variables:
    DUNECI_INSTALL_STAGE: "1"
    DUNECI_TEST_INSTALL: "1"
    DUNECI_PUBLISH_INSTALL_PREFIX: true
    DUNECI_PUBLISH_SUFFIX: "CLANG"
    PKG_CONFIG_PATH: /duneci/install/lib/pkgconfig:/duneci/install/lib/x86_64-linux-gnu/pkgconfig
    CMAKE_PREFIX_PATH: /duneci/install
  artifacts:
    paths:
      - install-prefix/
    reports:
      dotenv: install.env
    expire_in: 7 days

"debian:12 gcc-12-20 (release, with mpi)":
  variables:
    DUNECI_INSTALL_STAGE: "1"
    DUNECI_TEST_INSTALL: "1"
    DUNECI_PUBLISH_INSTALL_PREFIX: true
    DUNECI_PUBLISH_SUFFIX: "GCC"
    PKG_CONFIG_PATH: /duneci/install/lib/pkgconfig:/duneci/install/lib/x86_64-linux-gnu/pkgconfig
    CMAKE_PREFIX_PATH: /duneci/install
  artifacts:
    paths:
      - install-prefix/
    reports:
      dotenv: install.env
    expire_in: 7 days

# ---------------------------------------------------------------------------
# test tutorials as well
#
# The branch of the tutorials project is chosen at runtime: in general there is
# no matching branch in the tutorials project, so master is used. Only when a
# branch with the same name exists (coordinated feature development) is it used
# so the feature can be tested together. A `trigger:branch` cannot use a value
# computed in a job (dotenv variables are not expanded in trigger jobs), so the
# setup job writes a small child pipeline that contains the actual multi-project
# trigger with a literal branch. The INSTALL_JOB_ID_* values come from the
# dotenv reports of the two install jobs listed in `needs`.
pdelab-tutorials-setup:
  stage: downstream
  image: registry.dune-project.org/docker/ci/debian:12
  tags: [duneci]
  # This job only generates the trigger configuration; it must not inherit the
  # global dependency build before_script.
  before_script: ""
  needs:
    - "debian:12 clang-15-20 (release, require bindings)"
    - "debian:12 gcc-12-20 (release, with mpi)"
  script:
    - |
      set -e
      TUTORIALS_BRANCH="master"
      if git ls-remote --exit-code --heads \
           https://gitlab.dune-project.org/pdelab/dune-pdelab-tutorials.git \
           "${CI_COMMIT_REF_NAME}" >/dev/null; then
        TUTORIALS_BRANCH="${CI_COMMIT_REF_NAME}"
      fi
      echo "Triggering dune-pdelab-tutorials on branch '${TUTORIALS_BRANCH}'"
      cat > tutorials-trigger.yml <<EOF
      pdelab-tutorials:
        variables:
          INSTALL_JOB_ID_GCC: "${INSTALL_JOB_ID_GCC}"
          INSTALL_JOB_ID_CLANG: "${INSTALL_JOB_ID_CLANG}"
          UPSTREAM_PIPELINE_ID: "${CI_PIPELINE_ID}"
        trigger:
          project: pdelab/dune-pdelab-tutorials
          branch: "${TUTORIALS_BRANCH}"
          strategy: depend
        # Without rules the job would fall back to only:[branches,tags] and
        # the child pipeline of a merge request pipeline would be empty.
        rules:
          - when: on_success
      EOF
      cat tutorials-trigger.yml
  artifacts:
    paths:
      - tutorials-trigger.yml
    expire_in: 7 days
  rules:
    - when: manual
      allow_failure: false

pdelab-tutorials:
  stage: downstream
  needs:
    - pdelab-tutorials-setup
  trigger:
    include:
      - artifact: tutorials-trigger.yml
        job: pdelab-tutorials-setup
    strategy: depend
